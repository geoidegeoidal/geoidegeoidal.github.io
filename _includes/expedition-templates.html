{% for place in site.data.expedition %}
<template id="place-{{ place.id }}">
  <div class="exp-place-copy"><h2 class="exp-place-name">{{ place.name }}</h2><p class="exp-place-story">{{ place.title }}</p><p>{{ place.description }}</p><p>{{ place.detail }}</p><a class="exp-evidence" href="{% if place.link contains 'https://' %}{{ place.link }}{% else %}{{ place.link | relative_url }}{% endif %}">{{ place.action }} ↗</a>
  {% if place.id == 'puerto' %}<details class="exp-milestones"><summary>Recorrer los hitos aquí</summary>{% include trajectory.html %}</details>{% endif %}
  {% if place.id == 'observatorio' %}<a class="exp-evidence" href="https://doi.org/10.4995/raet.2017.7931">Leer investigación en teledetección ↗</a>{% endif %}
  {% if place.projects.size > 0 %}<h3>Explora los proyectos</h3><div class="exp-project-list">{% for id in place.projects %}{% assign project = site.data.projects | where: 'id', id | first %}<button type="button" data-project="{{ project.id }}">{{ project.name }}<span aria-hidden="true">↗</span></button>{% endfor %}</div>{% endif %}
  </div>
</template>
{% endfor %}
{% for project in site.data.projects %}
<template id="project-{{ project.id }}" data-name="{{ project.name | escape }}" data-summary="{{ project.summary | escape }}">
  <article class="exp-project">
    <h3>{{ project.name }}</h3>
    <p class="exp-project-category">{{ project.category }} · {{ project.status }}</p>
    <dl class="project-brief">
      <div><dt>Problema</dt><dd>{{ project.problem }}</dd></div>
      <div><dt>Mi aporte</dt><dd>{{ project.contribution }}</dd></div>
    </dl>
    <div class="project-access">
      <h4>Ver el resultado</h4>
      <div class="exp-project-links">
        {% if project.demo %}<a class="project-primary" href="{{ project.demo }}" target="_blank" rel="noopener noreferrer">{% if project.id == 'storytelling-11s' %}Abrir relato{% else %}Abrir proyecto{% endif %}<span aria-hidden="true"> ↗</span><span class="sr"> de {{ project.name }} (nueva pestaña)</span></a>{% endif %}
        {% if project.repo %}<a {% unless project.demo %}class="project-primary"{% endunless %} href="{{ project.repo }}" target="_blank" rel="noopener noreferrer">{% if project.status contains 'Plugin QGIS' %}Instalación y código{% else %}Ver código{% endif %}<span aria-hidden="true"> ↗</span><span class="sr"> de {{ project.name }} (nueva pestaña)</span></a>{% endif %}
      </div>
      <p class="project-access-hint">{% if project.demo %}Proyecto y código en nuevas pestañas; tu sesión queda aquí.{% elsif project.status contains 'Plugin QGIS' %}Se usa en QGIS. Abre el repositorio para instalarlo; no tiene demo web.{% else %}Disponible como código en GitHub; no tiene demo web enlazada.{% endif %}</p>
    </div>
    <p class="exp-project-note"><strong>Alcance</strong> {{ project.note }}</p>
    <details class="project-technical"><summary>Ficha técnica y contexto</summary><p class="exp-stack"><strong>Herramientas</strong> {{ project.stack }}</p><p>{{ project.summary }}</p><p>{{ project.detail }}</p></details>
  </article>
</template>
{% endfor %}
<template id="exp-trajectory"><div class="exp-trajectory"><h3>Trayectoria profesional</h3>{% include trajectory.html %}</div></template>
<template id="exp-skills"><div class="exp-skills"><h3>Herramientas de trabajo</h3>{% for group in site.data.technologies %}<h4>{{ group.name }}</h4><ul>{% for tool in group.tools %}<li><strong>{{ tool.name }}</strong> · {{ tool.level }}<br>{{ tool.use }}</li>{% endfor %}</ul>{% endfor %}<p>Los niveles son declarados, no una certificación.</p></div></template>
