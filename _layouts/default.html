<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1eee5">
  <title>{{ page.title | escape }} | Jorge Ulloa Roa</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | escape }} | Jorge Ulloa Roa">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/conmapas.png' | absolute_url }}">
  <meta property="og:locale" content="es_CL">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/dm-sans-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/motion.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="Bitácora de Jorge Ulloa Roa" href="{{ '/feed.xml' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/motion.js' | relative_url }}" defer></script>
</head>
<body>
  <div class="reading-progress" aria-hidden="true"></div>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Jorge Ulloa Roa, inicio">
        <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><ellipse cx="16" cy="16" rx="6" ry="14"/><path d="M2 16h28M5 8h22M5 24h22"/></svg>
        <span>jorge ulloa.</span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" hidden>Menú <span aria-hidden="true">☰</span></button>
      <nav id="site-nav" aria-label="Navegación principal">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Bio</a>
        <a href="{{ '/maps.html' | relative_url }}" {% if page.url == '/maps.html' %}aria-current="page"{% endif %}>Mapas</a>
        <a href="{{ '/code.html' | relative_url }}" {% if page.url == '/code.html' %}aria-current="page"{% endif %}>Código</a>
        <a href="{{ '/blog.html' | relative_url }}" {% if page.url == '/blog.html' or page.layout == 'post' %}aria-current="page"{% endif %}>Blog</a>
        <a class="button button-outline nav-contact" href="{{ '/' | relative_url }}#contacto">Conversemos <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  <main id="contenido" class="container" tabindex="-1">{{ content }}</main>
  <footer class="site-footer container">
    <a class="brand" href="{{ '/' | relative_url }}">jorge ulloa.</a>
    <p>Geografía, datos y territorio.<br><span>© {{ 'now' | date: '%Y' }} Jorge Ulloa Roa</span></p>
    <div class="footer-links">
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}/" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a>
    </div>
  </footer>
  <button class="motion-toggle" type="button" aria-pressed="false" hidden><span class="motion-symbol" aria-hidden="true">Ⅱ</span><span class="motion-label">Pausar movimiento</span></button>
</body>
</html>
